<script>
// ==================== 牌的数据模型 ====================
const SUITS = ['wan', 'tiao', 'tong'];
const SUIT_NAMES = { wan: '万', tiao: '条', tong: '筒' };
const SUIT_COLORS = { wan: '#c41e3a', tiao: '#228b22', tong: '#1e90ff' };

class Tile {
    constructor(suit, value) {
        this.suit = suit;
        this.value = value;
        this.id = `${suit}_${value}`;
    }
    toString() { return `${this.value}${SUIT_NAMES[this.suit]}`; }
    equals(other) { return this.suit === other.suit && this.value === other.value; }
}

function createDeck() {
    const deck = [];
    for (const suit of SUITS) {
        for (let v = 1; v <= 9; v++) {
            for (let i = 0; i < 4; i++) {
                deck.push(new Tile(suit, v));
            }
        }
    }
    return deck;
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// ==================== 玩家类 ====================
class Player {
    constructor(id, isHuman) {
        this.id = id;
        this.isHuman = isHuman;
        this.hand = [];
        this.melds = []; // {type:'peng'|'gang'|'angang'|'bugang', tiles:[]}
        this.discards = [];
        this.queSuit = null;
        this.isHu = false;
        this.isTing = false;
        this.score = 0;
        this.huInfo = null;
        this.gangScore = 0;
        this.gangCounts = { ming: 0, an: 0, bu: 0 };
    }

    sortHand() {
        const suitOrder = { wan: 0, tiao: 1, tong: 2 };
        this.hand.sort((a, b) => {
            if (suitOrder[a.suit] !== suitOrder[b.suit]) return suitOrder[a.suit] - suitOrder[b.suit];
            return a.value - b.value;
        });
    }

    handCounts() {
        const counts = {};
        for (const t of this.hand) {
            const key = t.id;
            counts[key] = (counts[key] || 0) + 1;
        }
        return counts;
    }

    hasQueSuit() {
        return this.hand.some(t => t.suit === this.queSuit);
    }

    removeTile(tile) {
        const idx = this.hand.findIndex(t => t.suit === tile.suit && t.value === tile.value);
        if (idx !== -1) this.hand.splice(idx, 1);
    }

    addTile(tile) {
        this.hand.push(tile);
    }
}

// ==================== 胡牌判断 ====================
class HuChecker {
    static canHu(hand, melds = []) {
        if (hand.length % 3 !== 2) return false;
        const counts = {};
        for (const t of hand) {
            counts[t.id] = (counts[t.id] || 0) + 1;
        }
        // 七对子
        if (hand.length === 14 && melds.length === 0) {
            if (this.isQiDui(counts)) return true;
        }
        // 标准牌型
        return this.checkStandard(counts);
    }

    static isQiDui(counts) {
        const values = Object.values(counts);
        if (values.length !== 7) return false;
        return values.every(v => v === 2 || v === 4);
    }

    static checkStandard(counts) {
        const keys = Object.keys(counts).filter(k => counts[k] > 0);
        if (keys.length === 0) return true;
        
        // 尝试每种牌做将
        for (const key of keys) {
            if (counts[key] >= 2) {
                counts[key] -= 2;
                if (this.canFormMelds(counts)) {
                    counts[key] += 2;
                    return true;
                }
                counts[key] += 2;
            }
        }
        return false;
    }

    static canFormMelds(counts) {
        // 找最小的非零牌（按花色+数值升序，避免受手牌插入顺序影响导致漏判）
        const suitOrder = { wan: 0, tiao: 1, tong: 2 };
        let firstKey = null;
        for (const key of Object.keys(counts)) {
            if (counts[key] <= 0) continue;
            if (firstKey === null) { firstKey = key; continue; }
            const [sa, va] = key.split('_');
            const [sb, vb] = firstKey.split('_');
            if (suitOrder[sa] < suitOrder[sb] ||
                (suitOrder[sa] === suitOrder[sb] && parseInt(va) < parseInt(vb))) {
                firstKey = key;
            }
        }
        if (!firstKey) return true;

        const [suit, valStr] = firstKey.split('_');
        const val = parseInt(valStr);

        // 尝试刻子
        if (counts[firstKey] >= 3) {
            counts[firstKey] -= 3;
            if (this.canFormMelds(counts)) { counts[firstKey] += 3; return true; }
            counts[firstKey] += 3;
        }

        // 尝试顺子
        const key2 = `${suit}_${val + 1}`;
        const key3 = `${suit}_${val + 2}`;
        if ((counts[key2] || 0) > 0 && (counts[key3] || 0) > 0) {
            counts[firstKey]--;
            counts[key2]--;
            counts[key3]--;
            if (this.canFormMelds(counts)) {
                counts[firstKey]++; counts[key2]++; counts[key3]++;
                return true;
            }
            counts[firstKey]++; counts[key2]++; counts[key3]++;
        }

        return false;
    }

    // 计算番数（累乘模型，仅 8 个番种）
    static calcFan(player, huTile, isZiMo, isQiangGang = false) {
        let fan = 1;
        let fanList = [];
        const allTiles = [...player.hand];
        const counts = {};
        for (const t of allTiles) counts[t.id] = (counts[t.id] || 0) + 1;

        // 七对（与对对胡互斥，统一 4 番，不区分龙七对）
        const isQiDui = (allTiles.length === 14 && player.melds.length === 0 && this.isQiDui(counts));
        const isQing = this.isQingYiSe(player);
        const isDuiDui = !isQiDui && this.isDuiDuiHu(player);
        const isJinGou = (player.hand.length === 2 && player.melds.length === 4);

        // 根（带根）：副露里的杠 + 手里 4 张相同的暗刻，每个根 ×2
        const meldGang = player.melds.filter(m => ['gang', 'angang', 'bugang'].includes(m.type)).length;
        const hiddenKan = Object.values(counts).filter(v => v === 4).length;
        const rootCount = meldGang + hiddenKan;

        if (isQiDui) {
            fan *= 4; fanList.push('七对');
        } else if (isDuiDui) {
            fan *= 2; fanList.push('对对胡');
        }

        // 清一色
        if (isQing) { fan *= 4; fanList.push('清一色'); }

        // 金钩钓
        if (isJinGou) { fan *= 2; fanList.push('金钩钓'); }

        // 根（带根）：每个根 ×2 累乘进番
        if (rootCount > 0) {
            fan *= Math.pow(2, rootCount);
            fanList.push(rootCount > 1 ? ('根×' + rootCount) : '根');
        }

        // 自摸（点炮不变，不额外乘番）
        if (isZiMo) { fan *= 2; fanList.push('自摸'); }

        if (fanList.length === 0) fanList.push('平胡');

        return { fan, fanList };
    }

    static isDuiDuiHu(player) {
        // 所有面子都是刻子/杠
        for (const meld of player.melds) {
            if (meld.type === 'peng' || meld.type === 'gang' || meld.type === 'angang' || meld.type === 'bugang') continue;
            return false;
        }
        // 手牌中剩余必须全是刻子 + 恰好一个将（不能含顺子）
        // 等价条件：恰好一个值的数量 ≡ 2 (mod 3)，其余均 ≡ 0 (mod 3)
        const counts = {};
        for (const t of player.hand) counts[t.id] = (counts[t.id] || 0) + 1;
        let pairCount = 0;
        for (const v of Object.values(counts)) {
            if (v % 3 === 2) pairCount++;
            else if (v % 3 !== 0) return false;
        }
        return pairCount === 1;
    }

    static isQingYiSe(player) {
        const suits = new Set();
        for (const t of player.hand) suits.add(t.suit);
        for (const m of player.melds) for (const t of m.tiles) suits.add(t.suit);
        return suits.size === 1;
    }
}

// ==================== AI策略 ====================
class AIPlayer {
    // 选择换三张
    static chooseExchange(player) {
        let bestSuit = null;
        let bestScore = -Infinity;

        for (const suit of SUITS) {
            const suitTiles = player.hand.filter(t => t.suit === suit);
            if (suitTiles.length < 3) continue;
            const score = this.evalExchangeSuit(player.hand, suit);
            if (score > bestScore) {
                bestScore = score;
                bestSuit = suit;
            }
        }

        if (!bestSuit) {
            // 如果所有花色都不足3张（理论上不会），选最多的
            let maxLen = 0;
            for (const suit of SUITS) {
                const len = player.hand.filter(t => t.suit === suit).length;
                if (len > maxLen) { maxLen = len; bestSuit = suit; }
            }
        }

        const suitTiles = player.hand.filter(t => t.suit === bestSuit);
        // 选最差的3张
        const scored = suitTiles.map(t => ({ tile: t, score: this.tileValue(t, suitTiles) }));
        scored.sort((a, b) => a.score - b.score);
        return scored.slice(0, 3).map(s => s.tile);
    }

    static evalExchangeSuit(hand, suit) {
        const suitTiles = hand.filter(t => t.suit === suit);
        let score = 0;
        score += (13 - suitTiles.length) * 10;
        const values = suitTiles.map(t => t.value);
        for (const v of values) {
            const hasNeighbor = values.includes(v - 1) || values.includes(v + 1);
            const hasPair = values.filter(x => x === v).length >= 2;
            if (!hasNeighbor && !hasPair) score += 15;
        }
        let pairs = 0, seqs = 0;
        for (let v = 1; v <= 9; v++) {
            if (values.filter(x => x === v).length >= 2) pairs++;
            if (values.includes(v) && values.includes(v + 1)) seqs++;
        }
        score -= (pairs * 20 + seqs * 15);
        return score;
    }

    static tileValue(tile, suitTiles) {
        const values = suitTiles.map(t => t.value);
        const v = tile.value;
        let val = 0;
        if (values.filter(x => x === v).length >= 2) val += 30;
        if (values.includes(v - 1) || values.includes(v + 1)) val += 20;
        if (values.includes(v - 2) || values.includes(v + 2)) val += 10;
        if (v >= 3 && v <= 7) val += 5;
        return val;
    }

    // 选择定缺
    static chooseQue(player) {
        let bestSuit = null;
        let minCount = Infinity;
        for (const suit of SUITS) {
            const count = player.hand.filter(t => t.suit === suit).length;
            if (count < minCount) {
                minCount = count;
                bestSuit = suit;
            }
        }
        return bestSuit;
    }

    // 选择出牌
    static chooseDiscard(player) {
        // 优先打缺门牌
        const queTiles = player.hand.filter(t => t.suit === player.queSuit);
        if (queTiles.length > 0) {
            // 打最没用的缺门牌
            const scored = queTiles.map(t => ({ tile: t, score: this.tileValue(t, queTiles) }));
            scored.sort((a, b) => a.score - b.score);
            return player.hand.indexOf(scored[0].tile);
        }

        // 正常出牌：打价值最低的
        let bestIdx = 0;
        let bestScore = Infinity;
        for (let i = 0; i < player.hand.length; i++) {
            const score = this.evalDiscard(player, i);
            if (score < bestScore) {
                bestScore = score;
                bestIdx = i;
            }
        }
        return bestIdx;
    }

    static evalDiscard(player, idx) {
        const tile = player.hand[idx];
        const others = player.hand.filter((_, i) => i !== idx);
        let score = 0;
        const values = others.filter(t => t.suit === tile.suit).map(t => t.value);
        const v = tile.value;

        // 孤张惩罚
        if (!values.includes(v - 1) && !values.includes(v + 1) &&
            !values.includes(v - 2) && !values.includes(v + 2) &&
            !values.includes(v)) {
            score -= 50;
        }
        // 边张惩罚
        if (v === 1 || v === 9) score -= 10;
        // 有对子加分
        if (values.includes(v)) score += 20;
        // 有搭子加分
        if (values.includes(v - 1) || values.includes(v + 1)) score += 15;

        return score;
    }

    // 是否碰
    static shouldPeng(player, tile) {
        if (tile.suit === player.queSuit) return false;
        if (player.hasQueSuit()) return false; // 还有缺门牌不碰
        const count = player.hand.filter(t => t.suit === tile.suit && t.value === tile.value).length;
        if (count >= 2) return Math.random() > 0.2;
        return false;
    }

    // 是否杠
    static shouldGang(player, tile) {
        if (tile.suit === player.queSuit) return false;
        // 若该牌相邻位置有牌（可能组成顺子），降低杠的概率，避免拆散听牌型
        const neighbors = player.hand.filter(t => t.suit === tile.suit &&
            (t.value === tile.value - 1 || t.value === tile.value + 1)).length;
        if (neighbors > 0) return Math.random() > 0.5;
        return true;
    }
}

// ==================== 游戏主控制器 ====================
class MahjongGame {
    constructor() {
        this.players = [];
        this.wall = [];
        this.currentPlayer = 0;
        this.phase = 'idle'; // idle, exchange, dingque, play, end
        this.lastDiscard = null;
        this.lastDiscardFrom = -1;
        this.exchangeDir = '';
        this.history = this.loadHistory();
        this.totalScore = this.history.reduce((s, r) => s + r.scores[0], 0);
        this.huCount = 0;
        this.gangScores = [0, 0, 0, 0]; // 刮风下雨即时结算
        this.lastRoundWinnerId = 0; // 上一局先胡的玩家，作为下一局庄家（初始为本人）
        this.dealerId = 0; // 本局庄家（开局玩家）
        this.timers = [];
        this.pending = null;
        this.soundEnabled = true; // 语音播报默认开启
        this.init();
    }

    // 统一管理定时器，避免「新游戏」后旧定时器操作新牌局
    schedule(fn, ms) {
        const id = setTimeout(() => {
            this.timers = this.timers.filter(t => t !== id);
            fn();
        }, ms);
        this.timers.push(id);
        return id;
    }

    clearTimers() {
        for (const id of this.timers) clearTimeout(id);
        this.timers = [];
    }

    // AI 思考延迟：3~5 秒随机，让玩家看清局势
    aiThinkDelay() {
        return 3000 + Math.floor(Math.random() * 2000);
    }

    // 语音播报（Web Speech API，仅动作词）
    speak(text) {
        if (!this.soundEnabled || !('speechSynthesis' in window)) return;
        try {
            window.speechSynthesis.cancel(); // 防止堆积，只播最新一句
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-CN';
            u.rate = 1.15;
            if (!this._zhVoice) {
                const voices = window.speechSynthesis.getVoices();
                this._zhVoice = voices.find(v => (v.lang || '').toLowerCase().startsWith('zh')) || null;
                if (!this._zhVoice) {
                    window.speechSynthesis.onvoiceschanged = () => {
                        const vs = window.speechSynthesis.getVoices();
                        this._zhVoice = vs.find(v => (v.lang || '').toLowerCase().startsWith('zh')) || null;
                    };
                }
            }
            if (this._zhVoice) u.voice = this._zhVoice;
            window.speechSynthesis.speak(u);
        } catch (e) { /* 语音不可用时不报错 */ }
    }

    toggleSound() {
        this.soundEnabled = !this.soundEnabled;
        const btn = document.getElementById('sound-toggle');
        if (btn) btn.textContent = this.soundEnabled ? '🔊 语音' : '🔇 静音';
    }

    // ==================== 历史记录（localStorage 持久化） ====================
    loadHistory() {
        try {
            const raw = localStorage.getItem('chuanma_history');
            if (!raw) return [];
            const arr = JSON.parse(raw);
            return Array.isArray(arr) ? arr : [];
        } catch (e) { return []; }
    }

    saveHistory() {
        try {
            localStorage.setItem('chuanma_history', JSON.stringify(this.history));
        } catch (e) { /* 存储不可用时静默 */ }
    }


    init() {
        this.clearTimers();
        this.maxFan = this.maxFan || null; // 最高番数上限（null=不封顶，会话内保持）
        this.players = [
            new Player(0, true),
            new Player(1, false),
            new Player(2, false),
            new Player(3, false)
        ];
        this.wall = [];
        this.currentPlayer = 0;
        this.phase = 'idle';
        this.lastDiscard = null;
        this.lastDiscardFrom = -1;
        this.huCount = 0;
        this.gangScores = [0, 0, 0, 0];
        this.pending = null;
        this.enableDiscard = false;
        this.render();
    }

    restart() {
        if (!confirm('确定开新局吗？当前牌局进度将丢失。')) return;
        this.init();
        this.start();
    }

    start() {
        this._resultSaved = false; // 新一局允许重新记录历史
        // 庄家 = 上一局先胡的玩家（首局/无记录时为本人）
        this.dealerId = (this.lastRoundWinnerId !== undefined && this.lastRoundWinnerId !== null) ? this.lastRoundWinnerId : 0;
        this._roundFirstWinner = null; // 本局第一个胡牌者（用于决定下一局庄家）
        // 洗牌
        this.wall = shuffle(createDeck());
        // 发牌
        for (const p of this.players) {
            p.hand = this.wall.splice(0, 13);
            p.sortHand();
        }
        this.phase = 'exchange';
        this.rollExchangeDirection();
        this.render();
        this.showExchangeModal();
    }

    // 回到开始界面（仅清局回空棋盘，不弹窗）
    toStartScreen() {
        this.init();
        document.getElementById('modal-container').innerHTML = '';
    }

    // 确认结算后回到牌桌：保留本局数据，亮出全部手牌
    backToTable() {
        document.getElementById('modal-container').innerHTML = '';
        this.render();
    }

    rollExchangeDirection() {
        const dice = Math.floor(Math.random() * 12) + 1;
        if ([1, 3, 5, 7, 9, 11].includes(dice)) {
            this.exchangeDir = 'opposite';
        } else if ([2, 6, 10].includes(dice)) {
            this.exchangeDir = 'clockwise';
        } else {
            this.exchangeDir = 'counterclockwise';
        }
        const dirNames = {
            opposite: '对家互换',
            clockwise: '顺时针换（给下家）',
            counterclockwise: '逆时针换（给上家）'
        };
        document.getElementById('direction-info').textContent = `换牌方向: ${dirNames[this.exchangeDir]}`;
    }

    getExchangeTarget(pid) {
        switch (this.exchangeDir) {
            case 'opposite': return (pid + 2) % 4;
            case 'clockwise': return (pid + 3) % 4;
            case 'counterclockwise': return (pid + 1) % 4;
        }
    }

    showExchangeModal() {
        const html = `
            <div class="modal-overlay" id="exchange-modal">
                <div class="modal lb-modal">
                    <h2>🔄 换三张</h2>
                    <p>请选择<b>同一花色</b>的3张牌进行交换</p>
                    <p>方向：${this.exchangeDir === 'opposite' ? '与对家互换' : this.exchangeDir === 'clockwise' ? '顺时针（给下家）' : '逆时针（给上家）'}</p>
                    <p style="color:#999;font-size:12px;">点击下方手牌选择3张同花色的牌</p>
                    <div class="hand-tiles" id="exchange-hand" style="flex-wrap:wrap;margin:15px 0;"></div>
                    <button class="modal-btn primary" id="exchange-confirm" disabled onclick="game.confirmExchange()">确认换牌</button>
                </div>
            </div>
        `;
        document.getElementById('modal-container').innerHTML = html;
        this.exchangeSelected = [];
        this.renderHandForExchange();
    }

    renderHandForExchange(highlightTiles) {
        const container = document.getElementById('exchange-hand');
        if (!container) return;
        container.innerHTML = '';
        const highlight = highlightTiles || [];
        this.players[0].hand.forEach((tile, idx) => {
            const el = this.createTileElement(tile, idx);
            if (this.exchangeSelected.includes(idx)) {
                el.classList.add('selected');
            } else if (highlight.includes(tile)) {
                el.classList.add('selected');
            }
            if (!highlightTiles) {
                el.onclick = () => this.toggleExchangeSelect(idx, tile);
            }
            container.appendChild(el);
        });
    }

    toggleExchangeSelect(idx, tile) {
        if (this.exchangeSelected.includes(idx)) {
            this.exchangeSelected = this.exchangeSelected.filter(i => i !== idx);
        } else {
            // 检查同花色
            if (this.exchangeSelected.length > 0) {
                const firstTile = this.players[0].hand[this.exchangeSelected[0]];
                if (tile.suit !== firstTile.suit) {
                    this.showToast('⚠️ 必须选择同一花色！');
                    return;
                }
            }
            if (this.exchangeSelected.length >= 3) {
                this.showToast('最多选3张');
                return;
            }
            this.exchangeSelected.push(idx);
        }
        this.renderHandForExchange();
        const btn = document.getElementById('exchange-confirm');
        if (btn) btn.disabled = this.exchangeSelected.length !== 3;
    }

    confirmExchange() {
        if (this.exchangeSelected.length !== 3) return;
        const humanTiles = this.exchangeSelected.map(i => this.players[0].hand[i]);

        // AI选择
        const aiSelections = {};
        for (let i = 1; i <= 3; i++) {
            aiSelections[i] = AIPlayer.chooseExchange(this.players[i]);
        }
        aiSelections[0] = humanTiles;

        // 执行交换
        const tempStore = {};
        for (let i = 0; i < 4; i++) {
            const selected = aiSelections[i];
            for (const tile of selected) {
                this.players[i].removeTile(tile);
            }
            tempStore[i] = selected;
        }

        for (let i = 0; i < 4; i++) {
            const target = this.getExchangeTarget(i);
            for (const tile of tempStore[target]) {
                this.players[i].addTile(tile);
            }
            this.players[i].sortHand();
        }

        // 换回给人类玩家的3张，用于高亮展示
        const humanReceived = tempStore[this.getExchangeTarget(0)];

        // 先把换回后的新手牌渲染到棋盘
        this.render();

        // 显示「换牌完成」过渡面板，玩家看到结果后再进入定缺
        this.showExchangeResult(humanReceived);
    }

    showExchangeResult(highlightTiles) {
        const html = `
            <div class="modal-overlay" id="exchange-modal">
                <div class="modal lb-modal">
                    <h2>🔄 换牌完成</h2>
                    <p>以下是换回后的手牌（<b>高亮</b>为换回的3张）</p>
                    <div class="hand-tiles" id="exchange-hand" style="flex-wrap:wrap;margin:15px 0;"></div>
                    <button class="modal-btn primary" onclick="game.showDingQueModal()">继续定缺</button>
                </div>
            </div>
        `;
        document.getElementById('modal-container').innerHTML = html;
        this.exchangeSelected = [];
        this.renderHandForExchange(highlightTiles);
    }

    showDingQueModal() {
        this.phase = 'dingque';
        // AI定缺
        for (let i = 1; i <= 3; i++) {
            this.players[i].queSuit = AIPlayer.chooseQue(this.players[i]);
        }

        const counts = { wan: 0, tiao: 0, tong: 0 };
        for (const t of this.players[0].hand) counts[t.suit]++;

        const html = `
            <div class="dingque-panel" id="dingque-modal">
                <h2>🚫 定缺</h2>
                <p>选择你要缺的花色（必须打完该花色才能胡牌）</p>
                <div class="suit-choices">
                    <div class="suit-choice wan" onclick="game.selectQue('wan')">万<span class="suit-count">${counts.wan}张</span></div>
                    <div class="suit-choice tiao" onclick="game.selectQue('tiao')">条<span class="suit-count">${counts.tiao}张</span></div>
                    <div class="suit-choice tong" onclick="game.selectQue('tong')">筒<span class="suit-count">${counts.tong}张</span></div>
                </div>
            </div>
        `;
        document.getElementById('modal-container').innerHTML = html;
    }

    selectQue(suit) {
        const counts = { wan: 0, tiao: 0, tong: 0 };
        for (const t of this.players[0].hand) counts[t.suit]++;
        const maxCount = Math.max(counts.wan, counts.tiao, counts.tong);
        const minCount = Math.min(counts.wan, counts.tiao, counts.tong);
        // 选了数量最多的花色（且存在更少的选择）时提醒，避免定错缺
        if (counts[suit] === maxCount && maxCount > minCount) {
            if (!confirm(`你选的「${SUIT_NAMES[suit]}」是你手中数量最多的花色（${counts[suit]}张），定缺通常应选最少的花色，确定要定缺这门吗？`)) return;
        }
        this.players[0].queSuit = suit;
        document.getElementById('modal-container').innerHTML = '';
        this.showToast(`定缺：${SUIT_NAMES[suit]}`);
        this.phase = 'play';
        this.currentPlayer = this.dealerId; // 由庄家（上一局先胡者）先手
        this.render();
        this.schedule(() => this.gameLoop(), 800);
    }

    // ==================== 游戏主循环 ====================
    gameLoop() {
        if (this.phase !== 'play') return;

        const player = this.players[this.currentPlayer];

        // 跳过已胡的玩家
        if (player.isHu) {
            this.nextPlayer();
            this.gameLoop();
            return;
        }

        // 检查是否只剩一个未胡
        const activePlayers = this.players.filter(p => !p.isHu);
        if (activePlayers.length <= 1) {
            this.endGame();
            return;
        }

        // 牌墙为空 -> 流局
        if (this.wall.length === 0) {
            this.liuJu();
            return;
        }

        // 摸牌
        const tile = this.wall.shift();
        player.addTile(tile);
        this.drawnTile = tile;
        this.render();

        // 检查暗杠
        const angangTile = this.checkAnGang(player);

        // 检查自摸胡
        const canHu = HuChecker.canHu(player.hand, player.melds) && !player.hasQueSuit();

        if (player.isHuman) {
            // 人类玩家
            this.showHumanActions(canHu, angangTile, tile);
        } else {
            // AI
            this.schedule(() => {
                if (canHu) {
                    this.doHu(player, tile, true);
                    return;
                }
                if (angangTile && AIPlayer.shouldGang(player, angangTile)) {
                    this.doAnGang(player, angangTile);
                    return;
                }
                // 检查补杠
                const bugangTile = this.checkBuGang(player);
                if (bugangTile) {
                    this.doBuGang(player, bugangTile);
                    return;
                }
                // 出牌
                const idx = AIPlayer.chooseDiscard(player);
                this.doDiscard(player, idx);
            }, this.aiThinkDelay());
        }
    }

    showHumanActions(canHu, angangTile, drawnTile) {
        const buttons = [];
        if (canHu) {
            buttons.push(`<button class="action-btn btn-hu" onclick="game.humanHu()">胡</button>`);
        }
        if (angangTile) {
            buttons.push(`<button class="action-btn btn-gang" onclick="game.humanAnGang()">杠(${angangTile.toString()})</button>`);
        }
        // 补杠
        const bugangTile = this.checkBuGang(this.players[0]);
        if (bugangTile) {
            buttons.push(`<button class="action-btn btn-gang" onclick="game.humanBuGang()">补杠(${bugangTile.toString()})</button>`);
        }
        // 仅当存在「胡/杠/补杠」等可选项时才显示「过」；普通出牌回合直接点手牌即可
        if (buttons.length > 0) {
            buttons.push(`<button class="action-btn btn-pass" onclick="game.humanPass()">过</button>`);
        }

        document.getElementById('action-buttons').innerHTML = buttons.join('');
        document.getElementById('hint-text').textContent = '请选择操作或点击手牌出牌';

        // 允许点击手牌出牌
        this.enableDiscard = true;
        this.drawnTile = drawnTile;
    }

    humanHu() {
        document.getElementById('action-buttons').innerHTML = '';
        document.getElementById('hint-text').textContent = '';
        this.enableDiscard = false;
        this.doHu(this.players[0], this.drawnTile, true);
    }

    humanAnGang() {
        document.getElementById('action-buttons').innerHTML = '';
        const tile = this.checkAnGang(this.players[0]);
        this.doAnGang(this.players[0], tile);
    }

    humanBuGang() {
        document.getElementById('action-buttons').innerHTML = '';
        const tile = this.checkBuGang(this.players[0]);
        this.doBuGang(this.players[0], tile);
    }

    humanPass() {
        document.getElementById('action-buttons').innerHTML = '';
        this.enableDiscard = true;
        document.getElementById('hint-text').textContent = '请点击手牌出牌';
    }

    // 出牌（点击手牌）
    onTileClick(idx) {
        if (this.phase !== 'play') return;
        if (this.currentPlayer !== 0) return;
        if (!this.enableDiscard) return;

        const player = this.players[0];
        this.enableDiscard = false;
        this.drawnTile = null;
        document.getElementById('action-buttons').innerHTML = '';
        document.getElementById('hint-text').textContent = '';
        this.doDiscard(player, idx);
    }

    doDiscard(player, idx) {
        const tile = player.hand.splice(idx, 1)[0];
        player.discards.push(tile);
        player.sortHand();
        this.lastDiscard = tile;
        this.lastDiscardFrom = player.id;
        this.render();
        this.speak(tile.toString());

        // 检查其他玩家能否碰/杠/胡
        this.schedule(() => this.checkOtherActions(tile, player.id), 400);
    }

    checkOtherActions(tile, fromId) {
        // 按座位顺序（从出牌者下家开始）扫描，收集所有可 胡/杠/碰 的候选
        const huPlayers = [];   // 一炮多响：收集全部可胡者，而非仅第一个
        let gangPlayer = null;
        let pengPlayer = null;

        for (let step = 1; step <= 3; step++) {
            const i = (fromId + step) % 4;
            const p = this.players[i];
            if (p.isHu) continue;
            if (p.hasQueSuit()) continue; // 还有缺门牌不能操作

            // 检查胡（收集全部，支持一炮多响/血战到底多人同胡）
            const testHand = [...p.hand, tile];
            if (HuChecker.canHu(testHand, p.melds)) {
                huPlayers.push(p);
            }

            // 检查杠（手牌有3张相同的）
            const count = p.hand.filter(t => t.suit === tile.suit && t.value === tile.value).length;
            if (!gangPlayer && count === 3) {
                gangPlayer = p;
            }

            // 检查碰
            if (!pengPlayer && count >= 2) {
                pengPlayer = p;
            }
        }

        // 存入待处理候选，按优先级 胡 > 杠 > 碰 解析
        this.pending = { tile, fromId, huPlayers, gangPlayer, pengPlayer, huOccurred: false };
        this.resolvePending();
    }

    // 按优先级依次解析待处理候选；玩家「过」时消费其候选后继续，避免吞掉他人权利
    resolvePending() {
        const pend = this.pending;
        if (!pend) { this.nextTurn(); return; }
        const { tile, fromId } = pend;

        // 胡：一炮多响，所有可胡者按座位顺序依次处理（血战到底多人可同胡）
        if (pend.huPlayers && pend.huPlayers.length) {
            const p = pend.huPlayers[0];
            if (p.isHuman) {
                this.showPengGangHuOptions(p, tile, 'hu');
                return;
            }
            // AI 直接胡，移出队列后继续处理其余可胡者
            pend.huPlayers.shift();
            pend.huOccurred = true;
            this.schedule(() => {
                this.doHu(p, tile, false, false, false); // advanceTurn=false：由 resolvePending 统一推进
                this.resolvePending();
            }, 1200);
            return;
        }

        if (pend.gangPlayer) {
            const p = pend.gangPlayer;
            pend.gangPlayer = null;
            if (p.isHu) {
                this.resolvePending();
                return;
            }
            if (p.isHuman) {
                this.showPengGangHuOptions(p, tile, 'gang');
            } else if (AIPlayer.shouldGang(p, tile)) {
                this.schedule(() => this.doMingGang(p, tile, fromId), 1200);
            } else {
                this.resolvePending();
            }
            return;
        }

        if (pend.pengPlayer) {
            const p = pend.pengPlayer;
            pend.pengPlayer = null;
            if (p.isHu) {
                this.resolvePending();
                return;
            }
            if (p.isHuman) {
                this.showPengGangHuOptions(p, tile, 'peng');
            } else if (AIPlayer.shouldPeng(p, tile)) {
                this.schedule(() => this.doPeng(p, tile, fromId), 1200);
            } else {
                this.resolvePending();
            }
            return;
        }

        // 所有动作结算完毕，统一推进回合（一炮多响需先结算全部胡再继续）
        const hadHu = pend.huOccurred;
        this.pending = null;
        const active = this.players.filter(pl => !pl.isHu);
        if (active.length <= 1 || this.huCount >= 3) {
            this.schedule(() => this.endGame(), 2000);
        } else if (hadHu) {
            // 胡牌后停顿，给玩家看清结算
            this.schedule(() => this.nextTurn(), 2000);
        } else {
            this.nextTurn();
        }
    }

    showPengGangHuOptions(player, tile, type) {
        const buttons = [];
        if (type === 'hu') {
            buttons.push(`<button class="action-btn btn-hu" onclick="game.doHuFromDiscard(${player.id})">胡</button>`);
        }
        if (type === 'gang' || type === 'hu') {
            const count = player.hand.filter(t => t.suit === tile.suit && t.value === tile.value).length;
            if (count === 3) {
                buttons.push(`<button class="action-btn btn-gang" onclick="game.doMingGangFromUI(${player.id})">杠</button>`);
            }
        }
        if (type === 'peng' || type === 'gang' || type === 'hu') {
            const count = player.hand.filter(t => t.suit === tile.suit && t.value === tile.value).length;
            if (count >= 2) {
                buttons.push(`<button class="action-btn btn-peng" onclick="game.doPengFromUI(${player.id})">碰</button>`);
            }
        }
        buttons.push(`<button class="action-btn btn-pass" onclick="game.passAction()">过</button>`);

        document.getElementById('action-buttons').innerHTML = buttons.join('');
        this.pendingTile = tile;
        this.pendingPlayer = player;
    }

    doHuFromDiscard(pid) {
        document.getElementById('action-buttons').innerHTML = '';
        const p = this.players[pid];
        // 从待胡队列移除已处理的玩家，保留其余可胡者（一炮多响）
        if (this.pending && this.pending.huPlayers) {
            this.pending.huPlayers = this.pending.huPlayers.filter(x => x.id !== pid);
            this.pending.huOccurred = true;
        }
        this.doHu(p, this.pendingTile, false, false, false); // advanceTurn=false：由 resolvePending 统一推进
        // 继续处理其余可胡者 / 推进回合
        this.resolvePending();
    }

    doMingGangFromUI(pid) {
        document.getElementById('action-buttons').innerHTML = '';
        if (this.pending) this.pending.huPlayers = []; // 杠吃掉该牌，其余可胡者不再胡
        this.doMingGang(this.players[pid], this.pendingTile, this.lastDiscardFrom);
    }

    doPengFromUI(pid) {
        document.getElementById('action-buttons').innerHTML = '';
        if (this.pending) this.pending.huPlayers = []; // 碰吃掉该牌，其余可胡者不再胡
        this.doPeng(this.players[pid], this.pendingTile, this.lastDiscardFrom);
    }

    passAction() {
        document.getElementById('action-buttons').innerHTML = '';
        // 当前玩家放弃对该牌的所有权利，但保留其他玩家的碰/杠/胡权利
        const p = this.pendingPlayer;
        if (this.pending && p) {
            if (this.pending.huPlayers) this.pending.huPlayers = this.pending.huPlayers.filter(x => x !== p);
            if (this.pending.gangPlayer === p) this.pending.gangPlayer = null;
            if (this.pending.pengPlayer === p) this.pending.pengPlayer = null;
        }
        this.resolvePending();
    }

    // ==================== 操作执行 ====================
    doHu(player, tile, isZiMo, isQiangGang = false, advanceTurn = true) {
        if (isQiangGang) {
            // 抢杠胡：牌来自补杠者手牌，加入胡牌者手牌用于算番（不从弃牌区弹）
            player.addTile(tile);
        } else if (!isZiMo) {
            player.addTile(tile);
            // 从弃牌区移除
            const fromPlayer = this.players[this.lastDiscardFrom];
            fromPlayer.discards.pop();
        }
        player.isHu = true;
        // 胡牌后立即禁用人类玩家交互，避免血战到底2秒等待窗口内仍可出牌
        if (player.isHuman) {
            document.getElementById('action-buttons').innerHTML = '';
            document.getElementById('hint-text').textContent = '';
            this.enableDiscard = false;
        }
        this.huCount++;
        // 记录本局第一个胡牌者，作为下一局庄家（连庄/流局时保持不变）
        if (this._roundFirstWinner === null || this._roundFirstWinner === undefined) {
            this._roundFirstWinner = player.id;
            this.lastRoundWinnerId = player.id;
        }

        const fanInfo = HuChecker.calcFan(player, tile, isZiMo, isQiangGang);
        player.huInfo = fanInfo;
        player.huInfo.isZiMo = isZiMo;
        player.huInfo.fromId = isZiMo ? player.id : this.lastDiscardFrom;
        player.huInfo.isQiangGang = isQiangGang;

        const huType = isZiMo ? '自摸' : (isQiangGang ? '抢杠胡' : '点炮');
        this.showToast(`🎉 ${player.isHuman ? '你' : 'AI·' + ['','东','北','西'][player.id]} ${huType}！${fanInfo.fanList.join('+')} = ${fanInfo.fan}番`);

        // 结算
        this.settleHu(player, fanInfo, isZiMo);

        this.render();
        this.speak('胡');

        // 检查是否结束 / 推进回合
        // advanceTurn=false 时（一炮多响）不自推，交由 resolvePending 在全部胡结算完后统一推进
        if (advanceTurn) {
            const activePlayers = this.players.filter(p => !p.isHu);
            if (activePlayers.length <= 1 || this.huCount >= 3) {
                this.schedule(() => this.endGame(), 2000);
            } else {
                // 血战到底继续：从胡牌者的下家开始
                this.currentPlayer = player.id;
                this.schedule(() => {
                    this.nextPlayer();
                    this.gameLoop();
                }, 2000);
            }
        }
    }

    settleHu(winner, fanInfo, isZiMo) {
        const cap = this.maxFan || Infinity;
        const baseScore = Math.min(fanInfo.fan, cap);
        const activePlayers = this.players.filter(p => !p.isHu || p.id === winner.id);

        if (isZiMo) {
            // 自摸：所有未胡的人付
            for (const p of this.players) {
                if (p.id === winner.id || p.isHu) continue;
                p.score -= baseScore;
                winner.score += baseScore;
            }
        } else {
            // 点炮：放炮者付
            const loser = this.players[this.lastDiscardFrom];
            loser.score -= baseScore;
            winner.score += baseScore;
        }
    }

    doPeng(player, tile, fromId) {
        // 从手牌移除2张
        let removed = 0;
        player.hand = player.hand.filter(t => {
            if (removed < 2 && t.suit === tile.suit && t.value === tile.value) {
                removed++;
                return false;
            }
            return true;
        });

        // 从弃牌区移除
        this.players[fromId].discards.pop();

        player.melds.push({ type: 'peng', tiles: [tile, tile, tile] });
        player.sortHand();
        this.currentPlayer = player.id;
        this.render();
        this.speak('碰');

        this.showToast(`${player.isHuman ? '你' : 'AI'} 碰！`);

        // 碰后出牌
        if (player.isHuman) {
            this.enableDiscard = true;
            document.getElementById('hint-text').textContent = '碰了！请点击手牌出牌';
        } else {
            this.schedule(() => {
                const idx = AIPlayer.chooseDiscard(player);
                this.doDiscard(player, idx);
            }, 800);
        }
    }

    doMingGang(player, tile, fromId) {
        // 从手牌移除3张
        let removed = 0;
        player.hand = player.hand.filter(t => {
            if (removed < 3 && t.suit === tile.suit && t.value === tile.value) {
                removed++;
                return false;
            }
            return true;
        });

        this.players[fromId].discards.pop();
        player.melds.push({ type: 'gang', tiles: [tile, tile, tile, tile] });

        // 点杠（明杠，别人打出第四张）：只由放炮者付2分（番数只在胡牌时作为根计入）
        const loser = this.players[fromId];
        if (loser && !loser.isHu) {
            loser.score -= 2;
            player.score += 2;
            player.gangScore += 2;
        }
        player.gangCounts.ming++;

        player.sortHand();
        this.currentPlayer = player.id;
        this.render();
        this.speak('杠');
        this.showToast(`${player.isHuman ? '你' : 'AI'} 点杠！+2`);

        // 杠后摸牌
        this.schedule(() => this.gameLoop(), 800);
    }

    doAnGang(player, tile) {
        // 从手牌移除4张
        player.hand = player.hand.filter(t => !(t.suit === tile.suit && t.value === tile.value));
        player.melds.push({ type: 'angang', tiles: [tile, tile, tile, tile] });

        // 暗杠：每家付2分（番数只在胡牌时作为根计入）
        for (let i = 0; i < 4; i++) {
            if (i !== player.id && !this.players[i].isHu) {
                this.players[i].score -= 2;
                player.score += 2;
                player.gangScore += 2;
            }
        }
        player.gangCounts.an++;

        player.sortHand();
        this.render();
        this.speak('杠');
        this.showToast(`${player.isHuman ? '你' : 'AI'} 暗杠！+2`);

        // 杠后摸牌
        this.schedule(() => this.gameLoop(), 800);
    }

    doBuGang(player, tile) {
        // 找到碰的面子，改为杠
        const meld = player.melds.find(m => m.type === 'peng' && m.tiles[0].suit === tile.suit && m.tiles[0].value === tile.value);
        if (meld) {
            // 抢杠胡：其他未胡且已定缺完成的玩家可胡该牌，则取消补杠
            const robber = this.players.find(p => p.id !== player.id && !p.isHu && !p.hasQueSuit() && HuChecker.canHu([...p.hand, tile], p.melds));
            if (robber) {
                this.lastDiscardFrom = player.id;
                player.removeTile(tile);
                this.doHu(robber, tile, false, true);
                return;
            }

            meld.type = 'bugang';
            meld.tiles.push(tile);
            player.removeTile(tile);

            // 补杠（贴杠）：每家付1分（番数只在胡牌时作为根计入）
            for (let i = 0; i < 4; i++) {
                if (i !== player.id && !this.players[i].isHu) {
                    this.players[i].score -= 1;
                    player.score += 1;
                    player.gangScore += 1;
                }
            }
            player.gangCounts.bu++;

            player.sortHand();
            this.render();
            this.speak('杠');
            this.showToast(`${player.isHuman ? '你' : 'AI'} 补杠！+1`);
            this.schedule(() => this.gameLoop(), 800);
        }
    }

    checkAnGang(player) {
        const counts = {};
        for (const t of player.hand) {
            counts[t.id] = (counts[t.id] || 0) + 1;
        }
        for (const [id, count] of Object.entries(counts)) {
            if (count === 4) {
                const [suit, val] = id.split('_');
                return new Tile(suit, parseInt(val));
            }
        }
        return null;
    }

    checkBuGang(player) {
        for (const meld of player.melds) {
            if (meld.type === 'peng') {
                const t = meld.tiles[0];
                if (player.hand.some(h => h.suit === t.suit && h.value === t.value)) {
                    return t;
                }
            }
        }
        return null;
    }

    nextTurn() {
        this.nextPlayer();
        this.gameLoop();
    }

    nextPlayer() {
        let next = (this.currentPlayer + 1) % 4;
        let count = 0;
        while (this.players[next].isHu && count < 4) {
            next = (next + 1) % 4;
            count++;
        }
        this.currentPlayer = next;
    }

    // ==================== 流局 ====================
    liuJu() {
        this.phase = 'end';
        let msg = '🀄 流局！\n\n';

        // 查花猪（还有缺门牌的）
        for (const p of this.players) {
            if (p.isHu) continue;
            if (p.hasQueSuit()) {
                // 花猪：赔给所有已胡的人
                msg += `${p.isHuman ? '你' : 'AI·' + ['','东','北','西'][p.id]} 是花猪！\n`;
                for (const winner of this.players) {
                    if (winner.isHu) {
                        p.score -= 16;
                        winner.score += 16;
                    }
                }
            }
        }

        // 查叫：先算每个未胡玩家听牌能胡的最大番数（0 表示未听牌）
        for (const p of this.players) {
            if (p.isHu) continue;
            p.tingFan = this.tingMaxFan(p);
            p.isTing = p.tingFan > 0;
        }

        // 未听牌的赔给听牌的：按听牌者「能胡的牌的番数」赔付（不再固定4分）
        const cap = this.maxFan || Infinity;
        for (const p of this.players) {
            if (p.isHu || p.isTing) continue;
            for (const t of this.players) {
                if (t.isTing && !t.isHu) {
                    const pay = Math.min(t.tingFan, cap);
                    p.score -= pay;
                    t.score += pay;
                }
            }
        }

        this.showResultModal(msg);
    }

    checkTing(player) {
        // 检查是否听牌：静止手牌加任意一张后能否胡
        if (player.hasQueSuit()) return false;
        for (const suit of SUITS) {
            if (suit === player.queSuit) continue;
            for (let v = 1; v <= 9; v++) {
                const testTile = new Tile(suit, v);
                const fullHand = [...player.hand, testTile];
                if (HuChecker.canHu(fullHand, player.melds)) return true;
            }
        }
        return false;
    }

    tingMaxFan(player) {
        // 听牌者能胡的所有牌里，取最大番数；未听牌返回 0（不含自摸番）
        if (player.hasQueSuit()) return 0;
        let best = 0;
        const savedHand = player.hand;
        for (const suit of SUITS) {
            if (suit === player.queSuit) continue;
            for (let v = 1; v <= 9; v++) {
                const testTile = new Tile(suit, v);
                const fullHand = [...savedHand, testTile];
                if (HuChecker.canHu(fullHand, player.melds)) {
                    player.hand = fullHand;
                    const info = HuChecker.calcFan(player, testTile, false, false);
                    if (info.fan > best) best = info.fan;
                }
            }
        }
        player.hand = savedHand;
        return best;
    }

    endGame() {
        this.phase = 'end';
        this.showResultModal('');
    }

    showResultModal(extraMsg) {
        let rows = '';
        for (const p of this.players) {
            const name = p.isHuman ? '你' : 'AI·' + ['','东','北','西'][p.id];
            let status = '';
            if (p.isHu) {
                status = `✅ 胡牌`;
            } else if (p.hasQueSuit()) {
                status = '🐷 花猪';
            } else if (p.isTing) {
                status = `👂 听牌 · 叫${p.tingFan || 1}番`;
            } else {
                status = '❌ 未听';
            }
            const scoreClass = p.score >= 0 ? 'positive' : 'negative';
            const rowClass = p.isHu ? 'winner' : '';

            let detail = '';
            if (p.isHu && p.huInfo) {
                const hi = p.huInfo;
                const fromName = hi.isZiMo ? '' : (this.players[hi.fromId] ? (this.players[hi.fromId].isHuman ? '你' : 'AI·' + ['','东','北','西'][hi.fromId]) : '');
                const huWay = hi.isZiMo ? '自摸' : (hi.isQiangGang ? '抢杠胡' : ('点炮 · 来源: ' + fromName));
                detail += `<div class="result-detail">${huWay} ｜ ${hi.fanList.join('+')} = ${hi.fan}番</div>`;
            }
            if (p.gangScore > 0) {
                const g = p.gangCounts;
                detail += `<div class="result-detail">杠 明×${g.ming} 暗×${g.an} 补×${g.bu} (+${p.gangScore})</div>`;
            }

            rows += `<div class="result-row ${rowClass}">
                <span><span>${name} ${status}</span><span class="score ${scoreClass}">${p.score >= 0 ? '+' : ''}${p.score}</span></span>
                ${detail}
            </div>`;
        }

        // 记录本局历史（每局仅记一次，避免重复计局）
        if (!this._resultSaved) {
            this._resultSaved = true;
            const details = this.players.map(p => {
                const status = p.isHu ? 'hu' : (p.hasQueSuit() ? 'zhu' : (p.isTing ? 'ting' : 'none'));
                return {
                    score: p.score,
                    status,
                    hu: p.huInfo ? {
                        isZiMo: p.huInfo.isZiMo,
                        isQiangGang: p.huInfo.isQiangGang,
                        fromId: p.huInfo.fromId,
                        fanList: p.huInfo.fanList,
                        fan: p.huInfo.fan
                    } : null,
                    gang: { ming: p.gangCounts.ming, an: p.gangCounts.an, bu: p.gangCounts.bu, score: p.gangScore }
                };
            });
            this.history.push({ t: new Date().toISOString(), scores: this.players.map(p => p.score), details });
            this.saveHistory();
            this.totalScore += this.players[0].score;
        }
        document.getElementById('total-score').textContent = this.totalScore;

        const html = `
            <div class="modal-overlay">
                <div class="modal lb-modal">
                    <h2>📊 本局结算</h2>
                    ${extraMsg ? `<p>${extraMsg}</p>` : ''}
                    <div class="result-panel">${rows}</div>
                    <p style="font-size:12px;color:#999;">你的累计总分: ${this.totalScore}</p>
                    <button class="modal-btn primary" onclick="game.backToTable()">✅ 确认结果</button>
                </div>
            </div>
        `;
        document.getElementById('modal-container').innerHTML = html;
    }

    // 番数设置面板
    showFanSettings() {
        const cur = this.maxFan || '';
        const presets = [
            { label: '不封顶', val: '' },
            { label: '8', val: '8' },
            { label: '16', val: '16' },
            { label: '32', val: '32' },
            { label: '64', val: '64' }
        ];
        const presetBtns = presets.map(pr =>
            `<button class="settings-preset${String(cur) === pr.val ? ' active' : ''}" data-val="${pr.val}" onclick="document.getElementById('fan-cap-input').value='${pr.val}';document.querySelectorAll('.settings-preset').forEach(b=>b.classList.remove('active'));this.classList.add('active');">${pr.label}</button>`
        ).join('');

        const html = `
            <div class="modal-overlay">
                <div class="modal lb-modal">
                    <h2>⚙️ 番数设置</h2>
                    <p style="font-size:13px;color:#bbb;">设置最高番数上限（仅封顶计分，明细仍显示真实番数）。不填 = 不封顶。</p>
                    <div class="settings-presets">${presetBtns}</div>
                    <label style="font-size:13px;color:#ccc;">自定义上限（正整数）</label>
                    <input id="fan-cap-input" class="settings-input" type="number" min="1" step="1" placeholder="不封顶" value="${cur}">
                    <div style="display:flex;gap:10px;margin-top:6px;">
                        <button class="modal-btn primary" onclick="game.saveFanCap(document.getElementById('fan-cap-input').value)">💾 保存</button>
                        <button class="modal-btn" onclick="document.getElementById('modal-container').innerHTML=''">关闭</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('modal-container').innerHTML = html;
    }

    saveFanCap(val) {
        val = (val === '' || val === null || val === undefined) ? null : parseInt(val, 10);
        this.maxFan = (val === null || isNaN(val) || val < 1) ? null : val;
        document.getElementById('modal-container').innerHTML = '';
        this.showToast(this.maxFan ? `最高番数已设为 ${this.maxFan}` : '已取消封顶（不封顶）');
    }

    // 积分榜 + 历史对局弹窗
    showLeaderboard() {
        const names = ['你', 'AI·东', 'AI·北', 'AI·西'];
        // 累计总分（按牌桌座位展示）
        const totals = [0, 0, 0, 0];
        this.history.forEach(r => r.scores.forEach((s, i) => { totals[i] += s; }));

        const seatBox = (label, total, isMe) => {
            const cls = total >= 0 ? 'positive' : 'negative';
            return `<div class="seat${isMe ? ' me' : ''}">
                <div class="seat-name">${label}</div>
                <div class="seat-score score ${cls}">${total >= 0 ? '+' : ''}${total}</div>
            </div>`;
        };
        let boardRows;
        if (!this.history.length) {
            boardRows = `<div class="table-empty">暂无对局记录</div>`;
        } else {
            boardRows = `
                <div class="table-seats">
                    <div class="seat-row center">${seatBox('北', totals[2], false)}</div>
                    <div class="seat-row between">${seatBox('西', totals[3], false)}${seatBox('东', totals[1], false)}</div>
                    <div class="seat-row center">${seatBox('你', totals[0], true)}</div>
                </div>`;
        }

        // 历史对局（倒序）
        let histRows = '';
        if (this.history.length === 0) {
            histRows = `<div class="result-row"><span>暂无历史对局</span></div>`;
        } else {
            for (let i = this.history.length - 1; i >= 0; i--) {
                const rec = this.history[i];
                const dt = new Date(rec.t).toLocaleString('zh-CN');
                const myScore = rec.scores[0];
                const myCls = myScore >= 0 ? 'positive' : 'negative';
                const detailId = `hist-detail-${i}`;
                let detail = '';
                const hasDetails = rec.details && rec.details.length === 4;
                if (hasDetails) {
                    const statusText = { hu: '✅ 胡牌', zhu: '🐷 花猪', ting: '👂 听牌', none: '❌ 未听' };
                    rec.details.forEach((d, j) => {
                        const dcls = d.score >= 0 ? 'positive' : 'negative';
                        let extra = '';
                        if (d.hu) {
                            const hi = d.hu;
                            const fromName = hi.isZiMo ? '' : (this.players[hi.fromId] ? (this.players[hi.fromId].isHuman ? '你' : 'AI·' + ['', '东', '北', '西'][hi.fromId]) : '');
                            const huWay = hi.isZiMo ? '自摸' : (hi.isQiangGang ? '抢杠胡' : ('点炮·' + fromName));
                            extra += `${huWay} ${hi.fanList.join('+')}=${hi.fan}番`;
                        }
                        if (d.gang && d.gang.score > 0) {
                            const g = d.gang;
                            extra += (extra ? ' | ' : '') + `杠 明×${g.ming} 暗×${g.an} 补×${g.bu} (+${g.score})`;
                        }
                        const extraHtml = extra ? ` | ${extra}` : '';
                        detail += `<div class="hist-detail-row">
                            <span class="hist-name">${names[j]} ·</span>
                            <span class="score ${dcls}">${d.score >= 0 ? '+' : ''}${d.score}</span>
                            ${statusText[d.status]}${extraHtml}
                        </div>`;
                    });
                } else {
                    rec.scores.forEach((s, j) => {
                        const dcls = s >= 0 ? 'positive' : 'negative';
                        detail += `<div class="hist-detail-row">
                            <span class="hist-name">${names[j]} ·</span>
                            <span class="score ${dcls}">${s >= 0 ? '+' : ''}${s}</span>
                        </div>`;
                    });
                }
                histRows += `
                    <div class="hist-item">
                        <div class="hist-head" onclick="game.toggleHistoryDetail('${detailId}')">
                            <span>📅 ${dt}</span>
                            <span class="score ${myCls}">你 ${myScore >= 0 ? '+' : ''}${myScore} ▾</span>
                        </div>
                        <div class="hist-detail" id="${detailId}" style="display:none;">${detail}</div>
                    </div>`;
            }
        }

        const html = `
            <div class="modal-overlay" onclick="if(event.target===this)document.getElementById('modal-container').innerHTML='';">
                <div class="modal lb-modal">
                    <h2>📈 积分榜</h2>
                    <div class="lb-section-title">累计总分（按方位）</div>
                    <div class="result-panel">${boardRows}</div>
                    <div class="lb-section-title">历史对局（点击展开明细）</div>
                    <div class="result-panel hist-list">${histRows}</div>
                    <div class="lb-actions">
                        <button class="modal-btn danger" onclick="game.clearHistory()">清空记录</button>
                        <button class="modal-btn" onclick="document.getElementById('modal-container').innerHTML='';">关闭</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('modal-container').innerHTML = html;
    }

    toggleHistoryDetail(id) {
        const el = document.getElementById(id);
        if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    clearHistory() {
        if (!confirm('确定清空所有历史对局记录吗？此操作不可恢复。')) return;
        this.history = [];
        this.totalScore = 0;
        this.saveHistory();
        document.getElementById('total-score').textContent = '0';
        this.showLeaderboard();
    }

    // ==================== 渲染 ====================
    render() {
        this.renderAllHands();
        this.renderAllDiscards();
        this.renderAllMelds();
        this.renderInfo();
        this.renderLastDiscard();
        document.getElementById('wall-count').textContent = this.wall.length;
    }

    renderLastDiscard() {
        const el = document.getElementById('last-discard');
        if (!el) return;
        if (!this.lastDiscard) { el.innerHTML = ''; return; }
        const names = ['你', 'AI·东', 'AI·北', 'AI·西'];
        const fromName = names[this.lastDiscardFrom] || '';
        el.innerHTML = `<div class="ld-label">${fromName} 打出</div>`;
        const tileEl = this.createTileElement(this.lastDiscard, -1);
        tileEl.classList.add('ld-tile');
        el.appendChild(tileEl);
    }

    renderAllHands() {
        for (let i = 0; i < 4; i++) {
            const container = document.getElementById(`hand-${i}`);
            container.innerHTML = '';
            const player = this.players[i];

            if (i === 0) {
                // 人类玩家：显示正面
                const queSuit = this.players[0].queSuit;
                player.hand.forEach((tile, idx) => {
                    const el = this.createTileElement(tile, idx);
                    el.onclick = () => this.onTileClick(idx);
                    // 缺门提示
                    if (queSuit && tile.suit === queSuit) {
                        el.classList.add('que-tile');
                    }
                    // 摸牌提示（仅人类回合）
                    if (this.currentPlayer === 0 && this.phase === 'play' && this.drawnTile && tile === this.drawnTile) {
                        el.classList.add('drawn-tile');
                    }
                    container.appendChild(el);
                });
            } else {
                // AI：牌局结束时亮出正面，否则显示背面
                if (this.phase === 'end') {
                    player.hand.forEach((tile) => {
                        const el = this.createTileElement(tile, -1);
                        el.style.cursor = 'default';
                        container.appendChild(el);
                    });
                } else {
                    for (let j = 0; j < player.hand.length; j++) {
                        const back = document.createElement('div');
                        back.className = 'tile-back';
                        container.appendChild(back);
                    }
                }
            }
        }
    }

    renderAllDiscards() {
        for (let i = 0; i < 4; i++) {
            const container = document.getElementById(`discard-${i}`);
            container.innerHTML = '';
            for (const tile of this.players[i].discards) {
                const el = this.createTileElement(tile, -1);
                el.style.cursor = 'default';
                container.appendChild(el);
            }
        }
    }

    renderAllMelds() {
        for (let i = 0; i < 4; i++) {
            const container = document.getElementById(`meld-${i}`);
            container.innerHTML = '';
            for (const meld of this.players[i].melds) {
                const group = document.createElement('div');
                group.className = 'meld-group';
                const showCount = meld.type === 'angang' ? 4 : meld.tiles.length;
                for (let j = 0; j < showCount; j++) {
                    if (meld.type === 'angang' && j > 0 && j < 3) {
                        // 暗杠中间两张显示背面
                        const back = document.createElement('div');
                        back.className = 'tile-back';
                        back.style.width = '30px';
                        back.style.height = '42px';
                        group.appendChild(back);
                    } else {
                        const el = this.createTileElement(meld.tiles[0], -1);
                        el.style.cursor = 'default';
                        group.appendChild(el);
                    }
                }
                container.appendChild(group);
            }
        }
    }

    renderInfo() {
        for (let i = 0; i < 4; i++) {
            const info = document.getElementById(`info-${i}`);
            const p = this.players[i];
            const name = i === 0 ? '你' : 'AI·' + ['','东','北','西'][i];
            let queText = p.queSuit ? `缺${SUIT_NAMES[p.queSuit]}` : '';
            let huText = p.isHu ? ' 🎉胡' : '';
            let dealerText = (i === this.dealerId) ? ' <span class="dealer-badge">庄</span>' : '';
            info.innerHTML = `${name}${dealerText} <span class="que-suit">${queText}</span>${huText} [${p.score}]`;
            info.className = 'player-info' + (this.currentPlayer === i && this.phase === 'play' ? ' active' : '');
        }
    }

    createTileElement(tile, idx) {
        const el = document.createElement('div');
        el.className = `tile ${tile.suit}`;
        el.innerHTML = `<span class="tile-value">${tile.value}</span><span class="tile-suit">${SUIT_NAMES[tile.suit]}</span>`;
        return el;
    }

    showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.display = 'block';
        toast.style.animation = 'none';
        toast.offsetHeight; // reflow
        toast.style.animation = 'fadeInOut 2s ease-in-out';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }
}

// ==================== 启动游戏 ====================
let game;
window.onload = () => {
    game = new MahjongGame();
};
</script>
